name: Supabase database migrations

# Applies supabase/migrations to the linked Supabase project whenever the schema changes on main.
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was created
#   SUPABASE_PROJECT_REF   the project reference (the "abcd1234" part of https://abcd1234.supabase.co)
# Until the secrets are added the job ends with a warning instead of failing.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/supabase-migrations.yml']
  workflow_dispatch:

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the Supabase secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Supabase secrets are not set yet. Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF under Settings > Secrets and variables > Actions, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Link the Supabase project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push
