/* =====================================================================
   LIVE PERSISTENCE — real storage via the `db` capability when this
   page is opened as a published Claude artifact, with a local-only
   fallback (this browser only) when it is not.
   ===================================================================== */
const PATH_CORE='chama/core',PATH_LEDGER='chama/ledger',PATH_AUDIT='chama/audit';
const LOCAL_KEY='chama-digital-data-v1',ROLE_KEY='chama-digital-role-v1';
const LOCK_KEY='chama-digital-lock-v1',UNLOCK_FLAG='chama-digital-unlocked-v1';
const CAP={db:null,user:null,me:null,tried:false};
const PERSIST={mode:'checking',unsub:[],saveTimer:null,saving:false,pendingRemote:null};

async function initCapabilities(){
  if(CAP.tried)return;CAP.tried=true;
  try{
    if(typeof window!=='undefined'&&window.claude&&typeof window.claude.use==='function'){
      CAP.db=await window.claude.use('db').catch(()=>null);
      CAP.user=await window.claude.use('user').catch(()=>null);
      if(CAP.user){try{CAP.me=await CAP.user.me()}catch(e){CAP.me=null}}
    }
  }catch(e){CAP.db=null;CAP.user=null}
}
const canManage=()=>!CAP.user||!CAP.me?true:!!CAP.me.canEdit; // local-only mode has no real access control layer, so allow
function splitForSave(){const {ledger,audit,...core}=S;return{core,ledgerDoc:{items:ledger},auditDoc:{items:audit}}}
function composeState(core,ledgerDoc,auditDoc){return{...core,ledger:(ledgerDoc&&ledgerDoc.items)||[],audit:(auditDoc&&auditDoc.items)||[]}}
function writeLocalCache(){
  try{const {core,ledgerDoc,auditDoc}=splitForSave();localStorage.setItem(LOCAL_KEY,JSON.stringify({core,ledgerDoc,auditDoc}))}catch(e){}
}
function readLocalCache(){
  try{const raw=localStorage.getItem(LOCAL_KEY);if(!raw)return false;const o=JSON.parse(raw);if(!o||!o.core)return false;S=composeState(o.core,o.ledgerDoc,o.auditDoc);return true}catch(e){return false}
}
function saveRolePref(){try{localStorage.setItem(ROLE_KEY,UI.role)}catch(e){}}
function readRolePref(){try{return localStorage.getItem(ROLE_KEY)}catch(e){return null}}

function saveState(){
  if(!S)return;
  writeLocalCache();
  if(!CAP.db)return;
  clearTimeout(PERSIST.saveTimer);
  PERSIST.saveTimer=setTimeout(flushRemote,350);
}
async function flushRemote(){
  if(!CAP.db||!S)return;
  const {core,ledgerDoc,auditDoc}=splitForSave();
  PERSIST.saving=true;
  try{
    await Promise.all([
      CAP.db.doc(PATH_CORE).set(core),
      CAP.db.doc(PATH_LEDGER).set(ledgerDoc),
      CAP.db.doc(PATH_AUDIT).set(auditDoc),
    ]);
    PERSIST.mode='synced';
  }catch(e){
    PERSIST.mode='sync-error';
  }
  PERSIST.saving=false;
  updateSyncChip();
}
function subscribeLive(){
  if(!CAP.db)return;
  PERSIST.unsub.forEach(u=>{try{u()}catch(e){}});PERSIST.unsub=[];
  let cores=null,ledgers=null,audits=null,first=true;
  const apply=()=>{
    if(!cores)return;
    const next=composeState(cores,ledgers,audits);
    if(first){S=next;recomputeActors();first=false;return}
    if(overlayStack.length){PERSIST.pendingRemote=next;updateSyncChip();return}
    S=next;recomputeActors();PERSIST.pendingRemote=null;
    renderNav();try{renderView('x','x',ROUTES[currentPage]?ROUTES[currentPage].render:()=>dashboardView.render())}catch(e){}
    updateSyncChip();
  };
  PERSIST.unsub.push(CAP.db.doc(PATH_CORE).onSnapshot(s=>{cores=s.exists?s.data():cores;apply()},()=>{PERSIST.mode='sync-error';updateSyncChip()}));
  PERSIST.unsub.push(CAP.db.doc(PATH_LEDGER).onSnapshot(s=>{ledgers=s.exists?s.data():{items:[]};apply()}));
  PERSIST.unsub.push(CAP.db.doc(PATH_AUDIT).onSnapshot(s=>{audits=s.exists?s.data():{items:[]};apply()}));
}
function applyPendingRemote(){
  if(!PERSIST.pendingRemote)return;
  S=PERSIST.pendingRemote;recomputeActors();PERSIST.pendingRemote=null;
  renderNav();try{renderView('x','x',ROUTES[currentPage]?ROUTES[currentPage].render:()=>dashboardView.render())}catch(e){}
  updateSyncChip();
}
function updateSyncChip(){
  const el=$('#demo-chip');if(!el||!S)return;
  const map={
    synced:[icon('check'),'Saved to your account'],
    local:[icon('info'),'Saved on this device only'],
    'sync-error':[icon('alert'),'Not syncing — saved on this device'],
    checking:[icon('info'),'Loading…'],
  };
  const [ic,label]=map[PERSIST.mode]||map.local;
  el.classList.toggle('warn-chip',PERSIST.mode==='sync-error');
  el.classList.toggle('ok-chip',PERSIST.mode==='synced');
  el.innerHTML=`${ic}<span>${esc(label)}</span>`;
  if(PERSIST.pendingRemote){el.innerHTML+=` <button type="button" class="link-btn tiny" data-act="apply-remote" style="margin-left:4px">Show update</button>`}
}
async function eraseAllData(){
  writeLocalCache.silent=true;
  try{localStorage.removeItem(LOCAL_KEY)}catch(e){}
  if(CAP.db){
    try{await Promise.all([CAP.db.doc(PATH_CORE).delete(),CAP.db.doc(PATH_LEDGER).delete(),CAP.db.doc(PATH_AUDIT).delete()])}catch(e){}
    PERSIST.unsub.forEach(u=>{try{u()}catch(e){}});PERSIST.unsub=[];
  }
  S=null;location.hash='#/welcome';document.body.dataset.mode='bare';route();
}
function downloadJSON(filename,obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},250);
}

/* ---------- App boot ---------- */
async function bootData(){
  await initCapabilities();
  if(CAP.db){
    try{
      const [c,l,a]=await Promise.all([CAP.db.doc(PATH_CORE).get(),CAP.db.doc(PATH_LEDGER).get(),CAP.db.doc(PATH_AUDIT).get()]);
      if(c.exists){
        S=composeState(c.data(),l.exists?l.data():null,a.exists?a.data():null);
        recomputeActors();PERSIST.mode='synced';subscribeLive();
      }else{
        S=null;PERSIST.mode='synced';
      }
    }catch(e){
      if(!readLocalCache())S=null;
      PERSIST.mode='sync-error';
    }
  }else{
    if(!readLocalCache())S=null;
    PERSIST.mode='local';
  }
  const savedRole=readRolePref();
  if(S&&savedRole&&S.members.some(m=>m.role===savedRole||ROLES.includes(savedRole)))UI.role=savedRole;
}
function hasRealData(){return !!(S&&(S.ledger.length||S.members.length>1||!S.demo))}

/* ---------- Device passcode lock (privacy, this device only) ---------- */
function simpleHash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
function lockInfo(){try{const raw=localStorage.getItem(LOCK_KEY);return raw?JSON.parse(raw):null}catch(e){return null}}
function setLock(pin){try{localStorage.setItem(LOCK_KEY,JSON.stringify({hash:simpleHash(pin)}))}catch(e){}}
function clearLock(){try{localStorage.removeItem(LOCK_KEY);sessionStorage.removeItem(UNLOCK_FLAG)}catch(e){}}
function isUnlocked(){try{return sessionStorage.getItem(UNLOCK_FLAG)==='1'}catch(e){return true}}
function markUnlocked(){try{sessionStorage.setItem(UNLOCK_FLAG,'1')}catch(e){}}
function needsLockScreen(){return !!lockInfo()&&!isUnlocked()}
function lockScreen(){
  document.body.dataset.mode='bare';
  setBare(`<div class="wiz" style="max-width:400px;padding-top:110px;text-align:center">
   <div style="width:52px;height:52px;margin:0 auto 16px">${LOGO}</div>
   <div class="wiz-card"><span class="tile-ic" style="width:48px;height:48px;margin:0 auto 14px">${icon('lock')}</span>
   <h1 style="font-size:1.25rem">Enter passcode</h1><p class="muted small" style="margin:8px 0 18px">This Chama's records are locked on this device.</p>
   <form id="lock-form">${field({label:'Passcode',name:'pin',type:'password',attrs:'inputmode="numeric" autocomplete="off"',cls:'',err:''})}
   <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px">${icon('lock')}Unlock</button></form></div></div>`);
  $('#f-pin').focus();
  $('#lock-form').addEventListener('submit',e=>{
    e.preventDefault();const v=$('#f-pin').value;
    if(lockInfo()&&simpleHash(v)===lockInfo().hash){markUnlocked();enterApp()}
    else{setErr($('#lock-form'),'pin','Incorrect passcode.');$('#f-pin').focus();$('#f-pin').select()}
  });
}


/* ---------- 23. Global event wiring ---------- */
function clearFilters(scope){UI.f[scope]={...UI.f[scope],q:'',member:'',role:'',status:'',pay:'',period:'',type:'',from:'',to:'',kind:'',user:'',limit:UI.f[scope]?.limit||25};renderNav();renderView('x','x',ROUTES[currentPage].render)}

function act(name,el,ev){
  const id=el.dataset.id,scope=el.dataset.scope;
  switch(name){
    case 'close-overlay':closeOverlay();break;
    case 'more-nav':toast('Use the sidebar (tap the menu icon) for every section.');break;
    case 'enter-demo':{
      const role=demoScreen.role||'Treasurer';
      const proceed=()=>{resetDemo();UI.role=role;saveRolePref();location.hash='#/dashboard';enterApp()};
      if(hasRealData())confirmDialog({title:'Replace current Chama data?',text:'Loading sample data will replace the Chama currently saved here. Consider downloading a backup from Settings first. This cannot be undone.',confirmLabel:'Replace with sample data',tone:'btn-maroon',onConfirm:proceed});
      else proceed();
      break}
    case 'rec-contrib':openRecContrib({memberId:el.dataset.member,period:el.dataset.period});break;
    case 'rec-saving':openRecSaving({memberId:el.dataset.member});break;
    case 'rec-loan':openRecLoan();break;
    case 'rec-repay':openRecRepay(el.dataset.loan);break;
    case 'add-member':openAddMember();break;
    case 'edit-member':openEditMember(id);break;
    case 'sched-meeting':openSchedule();break;
    case 'open-meeting':openMeeting(id);break;
    case 'open-record':openRecord(id);break;
    case 'open-loan':openLoan(id);break;
    case 'correct-record':openCorrect(id);break;
    case 'reverse-record':openReverse(id);break;
    case 'edit-chama':openEditChama();break;
    case 'edit-rules':openEditRules();break;
    case 'export-records':exportRecords();break;
    case 'statement-for':UI.report={type:'member',range:'this-month',memberId:id,from:'',to:'',result:null,loading:false};location.hash='#/reports';break;
    case 'clear-filters':clearFilters(scope);break;
    case 'more':{const f=UI.f[scope];f.limit+=25;renderListOnly(scope);break}
    case 'reset-demo':confirmDialog({title:'Restore sample data?',text:`This replaces every record currently saved${PERSIST.mode==='synced'?' to your account':' in this browser'} with fresh sample data. Consider downloading a backup from Settings first. This cannot be undone.`,confirmLabel:'Restore sample data',tone:'btn-maroon',onConfirm:()=>{resetDemo();UI.role='Treasurer';saveRolePref();renderNav();location.hash='#/dashboard';route();toast('Sample data restored.')}});break;
    case 'toggle-lock':openLockSettings();break;
    case 'backup-json':downloadJSON(`${(S.chama.name||'chama').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-backup-${todayISO()}.json`,S);toast('Backup downloaded.');break;
    case 'erase-data':confirmDialog({title:'Erase all Chama data',text:`This permanently deletes every member, contribution, saving, internal loan and audit record${PERSIST.mode==='synced'?' from your account':' from this browser'}. Consider downloading a backup first. This cannot be undone.`,confirmLabel:'Erase everything',tone:'btn-maroon',onConfirm:eraseAllData});break;
    case 'apply-remote':applyPendingRemote();break;
    case 'lock-now':try{sessionStorage.removeItem(UNLOCK_FLAG)}catch(e){};if(lockInfo()){lockScreen()}break;
    case 'loan-filter':{lf().status=el.dataset.status;lf().limit=25;renderNav();renderView('x','x',()=>loansView());break}
    case 'tab':{const scopeT=el.dataset.tabs,key=scopeT.startsWith('member-')?scopeT:scopeT;UI.tab[key]=el.dataset.tab;renderView('x','x',ROUTES[currentPage]?ROUTES[currentPage].render:()=>route());break}
    case 'report-type':UI.report.type=el.dataset.type;UI.report.result=null;renderView('x','x',()=>reportsView());break;
    case 'report-range':UI.report.range=el.dataset.range;UI.report.result=null;renderView('x','x',()=>reportsView());break;
    case 'generate-report':generateReport();break;
    case 'print-report':window.print();break;
    case 'download-report':if(UI.report.result)downloadCSV(UI.report.result.csvName,UI.report.result.csv);break;
    case 'reg-next-1':regState().step=2;regScreen();break;
    case 'reg-next-2':regState().step=3;regScreen();break;
    case 'reg-next-3':regState().step=4;regScreen();break;
    case 'reg-back':regState().step=Math.max(1,regState().step-1);regScreen();break;
    case 'reg-add-member':regState().members2.push({name:'',phone:''});regScreen();break;
    case 'reg-rm-member':regState().members2.splice(+el.dataset.idx,1);regScreen();break;
    case 'reg-create':{
      const proceed=()=>{regBuildChama();regState().step=5;regScreen()};
      if(hasRealData())confirmDialog({title:'Replace current Chama data?',text:'Creating this new Chama will replace the records currently saved here. Consider downloading a backup from Settings first. This cannot be undone.',confirmLabel:'Replace and create',tone:'btn-maroon',onConfirm:proceed});
      else proceed();
      break}
    case 'reg-enter':UI.reg=null;location.hash='#/dashboard';enterApp();break;
    default:break;
  }
}
function renderListOnly(scope){
  const map={members:['members',membersList],contribs:['contribs',contribList],savings:['savings',savingsList],records:['records',recordsList],loans:['loans',loansList],audit:['audit',auditList]};
  const wrap=$(`[data-list="${scope}"]`);if(wrap)wrap.innerHTML=map[scope][1]();
  else renderView('x','x',ROUTES[currentPage].render);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){e.preventDefault();act(t.dataset.act,t,e);return}
  const opt=e.target.closest('.opt-card,.chip[data-idx]');
  const rowEl=e.target.closest('tr[data-href]');
  if(rowEl&&!e.target.closest('button,a,select,input')){
    const href=rowEl.dataset.href;
    if(href.startsWith('@loan:'))openLoan(href.slice(6));else location.hash=href;
    return;
  }
});
document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-form]');
  if(!form)return;e.preventDefault();
  const name=form.dataset.form,d=formData(form);
  if(FORMS[name])FORMS[name](form,d);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-input="filter"]')){UI.f[t.dataset.scope][t.dataset.key]=t.value;UI.f[t.dataset.scope].limit=25;debounce(()=>renderListOnly(t.dataset.scope))}
  else if(t.matches('[data-change="contrib-check"]')||t.closest('#frm-c')&&t.name==='memberId')contribCheck(t.closest('form'));
  else if(t.closest('#frm-c'))contribCheck(t.closest('form'));
  else if(t.matches('[data-input="loan-preview"]')||t.closest('#frm-l'))loanPreview(t.closest('form'));
  else if(t.matches('[data-input="reg"]')){const r=regState();r[t.dataset.key]=t.type==='number'?t.value:t.value;syncRegButtons()}
  else if(t.matches('[data-input="reg-m"]')){regState().members2[+t.dataset.idx][t.dataset.key]=t.value}
});
function syncRegButtons(){
  const r=regState();
  if(r.step===1){const b=$('[data-act="reg-next-1"]');if(b)b.disabled=!r.name.trim()}
  if(r.step===2){const b=$('[data-act="reg-next-2"]');if(b)b.disabled=!r.leaderName.trim()||!r.phone.trim()}
}
let debounceT=null;const debounce=fn=>{clearTimeout(debounceT);debounceT=setTimeout(fn,150)};
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-change="filter"]')){UI.f[t.dataset.scope][t.dataset.key]=t.value;UI.f[t.dataset.scope].limit=25;renderListOnly(t.dataset.scope)}
  else if(t.id==='role-select'){UI.role=t.value;saveRolePref();renderNav();route()}
  else if(t.id==='cp'){UI.f.cperiod=t.value;renderView('x','x',()=>contributionsView())}
  else if(t.matches('[data-change="set-role"]'))setRole(t.dataset.id,t.value);
  else if(t.matches('[data-change="method-hint"]')){const box=t.closest('form');const hint=$(`[data-fld="ref"] .hint`,box);if(hint)hint.textContent=refHint(t.value);if(box.id==='frm-c')contribCheck(box)}
  else if(t.matches('[data-change="repay-hint"]'))repayHint(t.closest('form'));
  else if(t.matches('[data-change="reg"]')){regState()[t.dataset.key]=t.value;regScreen()}
  else if(t.matches('[data-change="report-field"]')){UI.report[t.dataset.key]=t.value;UI.report.result=null;renderView('x','x',()=>reportsView())}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('.tabs')&&['ArrowLeft','ArrowRight'].includes(e.key)){
    const bar=e.target.closest('.tabs'),tabsArr=$$('.tab',bar),i=tabsArr.indexOf(e.target);
    if(i>-1){e.preventDefault();const n=(i+(e.key==='ArrowRight'?1:-1)+tabsArr.length)%tabsArr.length;tabsArr[n].focus();tabsArr[n].click()}
  }
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&document.body.dataset.mode==='app'){e.preventDefault();$('#global-search')?.focus()}
});
$('#menu-btn')?.addEventListener('click',()=>document.body.classList.toggle('nav-open'));
document.addEventListener('DOMContentLoaded',async()=>{
  $('#menu-btn').addEventListener('click',()=>document.body.classList.add('nav-open'));
  $('#scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));
  $('#fab').addEventListener('click',()=>{
    if(!can('recordFinance'))return;
    const opts=[['rec-contrib','Record contribution','plus'],['rec-saving','Record savings','coins'],['rec-repay','Record repayment','loan']];
    openModal({title:'Quick record',body:`<div class="sheet-list">${opts.map(o=>`<button type="button" class="btn btn-secondary" data-act="${o[0]}" onclick="closeOverlay()">${icon(o[2])}${o[1]}</button>`).join('')}</div>`});
  });
  $('#global-search').addEventListener('input',()=>debounce(runSearch));
  $('#global-search').addEventListener('focus',()=>{if($('#global-search').value)runSearch()});
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#search-results').hidden=true});
  window.addEventListener('hashchange',route);
  showBootScreen();
  await bootData();
  ensureV06Data();
  if(S)saveState();
  if(needsLockScreen()){lockScreen();return}
  route();
});
function showBootScreen(){
  document.body.dataset.mode='bare';
  $('#bare').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div style="text-align:center"><div style="width:44px;height:44px;margin:0 auto 14px;opacity:.9">${LOGO}</div><p class="muted small">Loading your Chama…</p></div></div>`;
}
function openLockSettings(){
  const has=!!lockInfo();
  const body=`<form id="lock-setup-form" novalidate>
   ${field({label:has?'New passcode':'Choose a passcode',name:'pin1',type:'password',attrs:'inputmode="numeric" minlength="4" autocomplete="off"',hint:'At least 4 digits. This is a device screen lock, not encryption — anyone who resets this browser or knows the passcode can still get in.'})}
   ${field({label:'Confirm passcode',name:'pin2',type:'password',attrs:'inputmode="numeric" autocomplete="off"'})}
   <div class="chips" style="margin-top:14px">${has?'<button type="button" class="btn btn-maroon btn-sm" data-act="remove-lock">Remove passcode</button>':''}<button type="submit" class="btn btn-primary">${icon('lock')}${has?'Update passcode':'Set passcode'}</button></div></form>`;
  const w=openModal({title:'Device passcode',desc:'Protects this Chama\'s records on this device only.',body});
  $('#lock-setup-form',w).addEventListener('submit',e=>{
    e.preventDefault();const v1=$('#f-pin1',w).value,v2=$('#f-pin2',w).value;
    if(v1.length<4){setErr(w.querySelector('form'),'pin1','Use at least 4 digits.');return}
    if(v1!==v2){setErr(w.querySelector('form'),'pin2','Passcodes do not match.');return}
    setLock(v1);markUnlocked();closeOverlay();toast('Passcode set for this device.');
  });
  const rm=$('[data-act="remove-lock"]',w);
  if(rm)rm.addEventListener('click',()=>{clearLock();closeOverlay();toast('Passcode removed.')});
}
function runSearch(){
  const q=$('#global-search').value.trim().toLowerCase(),box=$('#search-results');
  if(!q||!S){box.hidden=true;return}
  const mem=visibleMembers().filter(m=>m.name.toLowerCase().includes(q)||m.id.toLowerCase().includes(q)).slice(0,5);
  const ledgerScope=UI.role==='Member'?S.ledger.filter(e=>e.memberId===me().id):S.ledger.filter(e=>e.chamaId===S.chama.chamaId);
  const recs=ledgerScope.filter(e=>e.id.toLowerCase().includes(q)||(e.ref&&e.ref.toLowerCase().includes(q))).slice(0,5);
  const pages=NAV.flatMap(g=>g.items).filter(it=>roleAllowedPage(it.id)&&navLabel(it).toLowerCase().includes(q)).slice(0,4);
  if(!mem.length&&!recs.length&&!pages.length){box.innerHTML='<div class="none">No permitted matches. Try a page, your member number or an authorized record number.</div>';box.hidden=false;return}
  const pagesHtml=pages.length?('<h3>Pages</h3>'+pages.map(p=>'<div role="option" data-go="#/'+p.id+'">'+icon(p.icon)+'<span>'+esc(navLabel(p))+'</span></div>').join('')):'';
  const memHtml=mem.length?('<h3>Members</h3>'+mem.map(m=>'<div role="option" data-go="#/members/'+m.id+'">'+avatar(m.id,'sm')+'<span>'+esc(m.name)+'<span class="muted"> · '+esc(m.id)+'</span></span></div>').join('')):'';
  const recHtml=recs.length?('<h3>Records</h3>'+recs.map(e=>'<div role="option" data-go="@rec:'+e.id+'">'+icon(TYPE_ICON[e.type])+'<span>'+esc(e.id)+'<span class="muted"> · '+esc(UI.role==='Member'?'Your record':mName(e.memberId))+' · '+ksh(e.amount)+'</span></span></div>').join('')):'';
  box.innerHTML=pagesHtml+memHtml+recHtml;box.hidden=false;
  $$('[role=option]',box).forEach(o=>o.addEventListener('click',()=>{const go=o.dataset.go;box.hidden=true;$('#global-search').value='';if(go.startsWith('@rec:'))openRecord(go.slice(5));else location.hash=go}));
}
